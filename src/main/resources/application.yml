spring:
  application:
    name: koready-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:local}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    disable-swagger-default-url: true
    url: /openapi/koready.yaml

koready:
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  security:
    google:
      issuer: ${GOOGLE_OAUTH_ISSUER:https://accounts.google.com}
      jwk-set-uri: ${GOOGLE_OAUTH_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:https://api.koready.cloud}
      audience: ${JWT_AUDIENCE:koready-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    staging-operator:
      enabled: ${KOREADY_STAGING_OPERATOR_ENABLED:false}
      token: ${KOREADY_STAGING_OPERATOR_TOKEN:}
  profile-image:
    storage: ${PROFILE_IMAGE_STORAGE:disabled}
    bucket: ${PROFILE_IMAGE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    upload-expiration: ${PROFILE_IMAGE_UPLOAD_EXPIRATION:10m}
    view-expiration: ${PROFILE_IMAGE_VIEW_EXPIRATION:5m}
  location:
    search:
      provider: ${LOCATION_SEARCH_PROVIDER:disabled}
      token-secret: ${LOCATION_SEARCH_TOKEN_SECRET:}
      token-ttl: ${LOCATION_SEARCH_TOKEN_TTL:10m}
    kakao:
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      max-response-bytes: ${KAKAO_LOCAL_MAX_RESPONSE_BYTES:524288}
      connect-timeout: ${KAKAO_LOCAL_CONNECT_TIMEOUT:3s}
      read-timeout: ${KAKAO_LOCAL_READ_TIMEOUT:5s}
  evidence-bundle:
    directory: ${EVIDENCE_BUNDLE_DIRECTORY:${user.home}/.koready/evidence-bundles}
    download-expiration: ${EVIDENCE_BUNDLE_DOWNLOAD_EXPIRATION:5m}
    worker:
      poll-delay: ${EVIDENCE_BUNDLE_WORKER_POLL_DELAY:30s}
  kto:
    api:
      base-url: ${KTO_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
      service-key: ${KTO_SERVICE_KEY:}
      max-response-bytes: ${KTO_MAX_RESPONSE_BYTES:4194304}
      connect-timeout: ${KTO_CONNECT_TIMEOUT:3s}
      read-timeout: ${KTO_READ_TIMEOUT:10s}
      mobile-os: ${KTO_MOBILE_OS:ETC}
      mobile-app: ${KTO_MOBILE_APP:KoReady}
    english-api:
      base-url: ${KTO_ENG_API_BASE_URL:https://apis.data.go.kr/B551011/EngService2}
      service-key: ${KTO_SERVICE_KEY:}
      max-response-bytes: ${KTO_MAX_RESPONSE_BYTES:4194304}
      connect-timeout: ${KTO_CONNECT_TIMEOUT:3s}
      read-timeout: ${KTO_READ_TIMEOUT:10s}
      mobile-os: ${KTO_MOBILE_OS:ETC}
      mobile-app: ${KTO_MOBILE_APP:KoReady}
    photo-award-api:
      base-url: ${KTO_PHOTO_AWARD_API_BASE_URL:https://apis.data.go.kr/B551011/PhokoAwrdService}
      service-key: ${KTO_SERVICE_KEY:}
      max-response-bytes: ${KTO_MAX_RESPONSE_BYTES:4194304}
      connect-timeout: ${KTO_CONNECT_TIMEOUT:3s}
      read-timeout: ${KTO_READ_TIMEOUT:10s}
      mobile-os: ${KTO_MOBILE_OS:ETC}
      mobile-app: ${KTO_MOBILE_APP:KoReady}
    photo-gallery-api:
      base-url: ${KTO_PHOTO_GALLERY_API_BASE_URL:https://apis.data.go.kr/B551011/PhotoGalleryService1}
      service-key: ${KTO_SERVICE_KEY:}
      max-response-bytes: ${KTO_MAX_RESPONSE_BYTES:4194304}
      connect-timeout: ${KTO_CONNECT_TIMEOUT:3s}
      read-timeout: ${KTO_READ_TIMEOUT:10s}
      mobile-os: ${KTO_MOBILE_OS:ETC}
      mobile-app: ${KTO_MOBILE_APP:KoReady}
    related-tour-api:
      base-url: ${KTO_RELATED_TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/TarRlteTarService1}
      service-key: ${KTO_SERVICE_KEY:}
      max-response-bytes: ${KTO_MAX_RESPONSE_BYTES:4194304}
      connect-timeout: ${KTO_CONNECT_TIMEOUT:3s}
      read-timeout: ${KTO_READ_TIMEOUT:10s}
      mobile-os: ${KTO_MOBILE_OS:ETC}
      mobile-app: ${KTO_MOBILE_APP:KoReady}
    batch:
      page-size: ${KTO_BATCH_PAGE_SIZE:200}
      flush-size: ${KTO_BATCH_FLUSH_SIZE:50}
      max-concurrency: ${KTO_BATCH_MAX_CONCURRENCY:1}
    manual-batch:
      worker:
        enabled: ${KTO_MANUAL_BATCH_WORKER_ENABLED:true}
        poll-delay: ${KTO_MANUAL_BATCH_WORKER_POLL_DELAY:30s}
    detail-enrichment:
      schedule:
        enabled: ${KTO_DETAIL_DAILY_SCHEDULE_ENABLED:false}
        cron: ${KTO_DETAIL_DAILY_SCHEDULE_CRON:0 */30 * * * *}
        zone: ${KTO_DETAIL_DAILY_SCHEDULE_ZONE:Asia/Seoul}
        daily-places: ${KTO_DETAIL_DAILY_PLACES:800}
        chunk-places: ${KTO_DETAIL_DAILY_CHUNK_PLACES:50}
    related-tour-resume:
      schedule:
        enabled: ${KTO_RELATED_TOUR_RESUME_SCHEDULE_ENABLED:false}
        cron: ${KTO_RELATED_TOUR_RESUME_SCHEDULE_CRON:0 15 0 * * *}
        zone: ${KTO_RELATED_TOUR_RESUME_SCHEDULE_ZONE:Asia/Seoul}
    snapshot:
      storage: ${KTO_SNAPSHOT_STORAGE:local}
      directory: ${KTO_SNAPSHOT_DIRECTORY:${user.home}/.koready/kto-snapshots}
      download:
        expiration: ${KTO_SNAPSHOT_DOWNLOAD_EXPIRATION:5m}
      s3:
        bucket: ${KTO_SNAPSHOT_S3_BUCKET:}
        region: ${AWS_REGION:ap-northeast-2}
        connect-timeout: ${KTO_SNAPSHOT_S3_CONNECT_TIMEOUT:3s}
        read-timeout: ${KTO_SNAPSHOT_S3_READ_TIMEOUT:10s}
